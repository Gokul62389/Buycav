<style>/* ---------- Shop At (store locator) ---------- */
.loc{padding-block:clamp(28px,3.4vw,48px) clamp(80px,9vw,128px)}

.shop b{font:700 24px/1.15 var(--d);letter-spacing:-.01em;display:block;margin-bottom:6px}

.shop .acts{display:grid;gap:8px;justify-items:end}
.shop .acts a:not(.btn){color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

.shop.on{box-shadow:0 0 0 2px var(--gold)}
.shop .pin{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.shop .pin[aria-pressed=true]{color:var(--grey);text-decoration:none;cursor:default}
.shop .pin[aria-pressed=true]::before{content:"● ";color:var(--gold)}
@media (max-width:900px){.loc .wrap{grid-template-columns:1fr}}

const sels = ['c_name', 's_name', 'd_name', 'p_name'].map(id => $('#' + id));
const go = $('#loc-form .go'), out = $('#results');
const fill = (sel, keys) => {
  sel.length = 1;
  keys.sort().forEach(k => sel.add(new Option(k, k)));
  sel.disabled = !keys.length;
};
const level = i => sels.slice(0, i).reduce((o, s) => o[s.value], SHOPS);
fill(sels[0], Object.keys(SHOPS));
sels.forEach((sel, i) => sel.addEventListener('change', () => {
  // picking a level resets everything after it
  sels.slice(i + 1).forEach(s => { s.length = 1; s.disabled = true; });
  if (sel.value && i < 3) { fill(sels[i + 1], Object.keys(level(i + 1))); sels[i + 1].focus(); }
  go.disabled = !sels.every(s => s.value);
}));
const esc2 = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// keyless Google Maps embed, centred on the shop's name and address
const embed = s => 'https://maps.google.com/maps?q=' + encodeURIComponent(`${s.name}, ${s.addr}, Kerala`) + '&z=16&output=embed';
let shown = [];
out.addEventListener('click', e => {
  const b = e.target.closest('.pin'); if (!b) return;
  const s = shown[b.dataset.i], f = $('#loc-frame');
  f.src = embed(s); f.title = 'Map: ' + s.name;
  $$('.shop', out).forEach((c, i) => { c.classList.toggle('on', i == b.dataset.i); $('.pin', c).setAttribute('aria-pressed', i == b.dataset.i); });

});
const render = quiet => {
  if (!sels.every(s => s.value)) return;
  const list = shown = level(4) || [];
  const place = sels.slice(1).map(s => s.value).reverse().join(', ');
  out.innerHTML = `<div><h3>CAV shops in ${esc2(sels[3].value)}</h3><p class="meta">${list.length} ${list.length === 1 ? 'result' : 'results'} · ${esc2(place)}</p></div>`

$('#loc-form').addEventListener('submit', e => { e.preventDefault(); render(); });
// pre-fill any level with only one choice (India, Kerala); show results once all four are chosen
sels.forEach((sel, i) => {
