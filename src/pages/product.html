<!--{"title": "Frame · CAV", "desc": "CAV eyeglass frame: photos, size, colour, shape and material. Find it at a CAV shop near you.", "preload": "", "nav": "shop.html"}-->
<style>/* ---------- Product detail ---------- */
.bc{padding-block:24px 8px}
.bc ol{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:15px;font-weight:500;color:#9a9a9a}
.bc li+li::before{content:"›";margin-right:10px}
.bc a{transition:color .2s}
.bc a:hover,.bc [aria-current]{color:#fff}
.pd{padding-block:clamp(32px,3.4vw,48px) clamp(72px,7vw,104px)}
.pd .wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,4.4vw,64px);align-items:start}
.gal{display:grid;gap:14px}
.stage{position:relative;aspect-ratio:1;border-radius:24px;background:#f4f4f2;overflow:hidden;touch-action:pan-y;cursor:zoom-in}
.stage img{position:absolute;inset:0;margin:auto;width:92%;height:92%;object-fit:contain;mix-blend-mode:multiply;opacity:0;transition:opacity .45s var(--ease),transform .35s var(--ease);transform-origin:var(--ox,50%) var(--oy,50%)}
.stage img.on{opacity:1}
.stage.is-zoom img.on{transform:scale(1.9)}
.stage .nav-b{position:absolute;top:50%;z-index:2;width:48px;height:48px;margin-top:-24px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;opacity:0;transition:opacity .25s,background-color .2s}
.stage:hover .nav-b,.stage .nav-b:focus-visible{opacity:1}
.stage .nav-b:hover{background:var(--gold)}
.stage .nav-b svg{width:20px;height:20px;stroke-width:2}
.stage .prev{left:16px}.stage .next{right:16px}
.stage .idx{position:absolute;left:16px;bottom:16px;z-index:2;background:rgba(11,11,11,.72);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.thumbs button{aspect-ratio:4/3;border-radius:16px;background:#f4f4f2;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.thumbs button[aria-current=true]{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transform:scale(1.15)}
.info{position:sticky;top:24px;display:grid;gap:24px;align-content:start}
.info .kick{font-size:15px;font-weight:600;color:#9a9a9a}
.info .kick a{color:#d9d9d9;text-decoration:underline;text-underline-offset:3px}
.info h1{font:700 clamp(48px,5vw,80px)/.92 var(--d);letter-spacing:-.035em}
.info h1 .c{display:block;color:var(--gold);font-size:.5em;letter-spacing:-.02em;margin-top:10px}
.info .short{font-size:clamp(18px,1.5vw,21px);line-height:1.55;color:#d9d9d9}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:18px;overflow:hidden}
.specs div{background:#151515;padding:16px 18px}
.specs dt{font-size:13px;font-weight:700;color:#9a9a9a;margin-bottom:4px}
.specs dd{margin:0;font-size:17px;font-weight:600}
.specs .av,.specs .cw{display:flex;align-items:center;gap:8px}
.specs .av::before{content:"";width:8px;height:8px;border-radius:50%;background:#3fbf6f}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta .btn{flex:1 1 200px}
.cta .wa-b{background:#fff;color:var(--ink)}
.cta .wa-b:hover{background:var(--gold)}
.cta .wa-b svg{width:20px;height:20px;fill:#25d366}
.meta-l{font-size:15px;color:#9a9a9a;display:flex;flex-wrap:wrap;gap:6px 20px}
.meta-l b{color:#d9d9d9;font-weight:600}
/* reviews: summary + filters on the left, list on the right */
.rw{background:#fff;color:var(--ink);padding-block:clamp(48px,5vw,72px)}
.rw .wrap{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.rw-sum{position:sticky;top:120px;display:grid;gap:14px}
.rw-sum h2{font:700 clamp(28px,2.6vw,36px)/1 var(--d);letter-spacing:-.03em}
.rw-avg{display:flex;align-items:center;gap:12px}
.rw-avg b{font:800 44px/1 var(--d);letter-spacing:-.04em}
.rw-avg p{font-size:14px;color:var(--grey);margin-top:4px}
.rate{position:relative;display:inline-block;width:max-content;justify-self:start;font-size:var(--fs,22px);line-height:1;letter-spacing:2px;color:#d6d6d2}
.rate::before,.rate i::before{content:"★★★★★"}
.rate i{position:absolute;inset:0 auto 0 0;width:calc(var(--r)/5*100%);overflow:hidden;color:var(--gold);font-style:normal;white-space:nowrap}
.rw-bars{display:grid;gap:0;list-style:none;margin:0;padding:0}
.rw-bars button{width:100%;display:grid;grid-template-columns:36px 1fr 22px;align-items:center;gap:10px;padding:5px 8px;margin-inline:-8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);transition:background-color .2s}
.rw-bars button:hover:not(:disabled){background:var(--tile)}
.rw-bars button[aria-pressed=true]{background:var(--tile)}
.rw-bars button:disabled{color:#a8a8a4;cursor:default}
.rw-bars .bar{height:6px;border-radius:99px;background:#ececea;overflow:hidden}
.rw-bars .bar i{display:block;height:100%;width:var(--w);background:var(--gold);border-radius:inherit;transition:width .8s var(--ease)}
.rw-bars .n{text-align:right;color:var(--grey);font-weight:500}
.rw-main{display:grid;gap:12px;min-width:0}
.rw-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.rw-head p{font-size:15px;color:var(--grey)}
.rw-head p button{color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:3px;margin-left:6px}
.rw-head .field{grid-auto-flow:column;align-items:center;gap:10px}
.rw-head select{min-height:38px;padding-block:6px;font-size:14px;width:auto}
.rw-head .field label{font-size:14px}
.rw-list{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.rw-card{background:var(--tile);border-radius:16px;padding:16px 20px;display:grid;gap:6px;animation:rwIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rwIn{from{opacity:0;transform:translateY(10px)}}
.rw-card header{display:flex;align-items:center;gap:10px}
.rw-card .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font:700 15px/1 var(--d);flex:none}
.rw-card .who b{font-size:15px}
.rw-card .who span{font-size:13px;color:var(--grey);margin-left:8px}
.rw-card .tag{margin-left:auto;font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;background:#fff;color:var(--grey);white-space:nowrap}
.rw-card .tag.pend{background:#fff4dc;color:#7a5a12}
.rw-card p{font-size:15px;line-height:1.55;color:#2b2b2b;overflow-wrap:anywhere}
.rw-empty{background:var(--tile);border-radius:16px;padding:20px;font-size:15px;line-height:1.6;color:var(--grey)}
.rw-more{justify-self:start}
.rw-more[hidden]{display:none}
.rv-form{display:grid;gap:14px;background:var(--tile);border-radius:16px;padding:clamp(18px,2vw,24px)}
.rv-form[hidden]{display:none}
.rv-form h3{font:700 22px/1.1 var(--d)}
.rv-form .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rv-form .field input,.rv-form .field textarea{background:#fff}
.rv-form .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.rv-form .note{font-size:14px;color:var(--grey)}
.stars{display:flex;gap:6px;border:0;padding:0;margin:0}
.stars legend{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;padding:0}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:28px;line-height:1;color:#c9c9c4;cursor:pointer;transition:color .15s,transform .15s}
.stars label:hover{transform:scale(1.12)}
.stars .lit{color:var(--gold)}
.stars input:focus-visible+label{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.rv-done{background:#e9f6ee;border-radius:16px;padding:18px 22px;color:#1d5a35;font-weight:600}
.rv-done[hidden]{display:none}
@media (max-width:900px){.rw .wrap{grid-template-columns:1fr}.rw-sum{position:static}}
@media (prefers-reduced-motion:reduce){.rw-card{animation:none}.rw-bars .bar i{transition:none}}
.rel{padding-block:clamp(72px,7vw,104px)}
.rel h2{margin-bottom:40px}
.rel .pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}
.rel .card .ph{background:#f4f4f2}
.rel .card h3,.rel .card h3 a{color:#fff}
.rel .sw{color:#bdbdbd}
.nf{padding-block:120px;display:grid;justify-items:start;gap:20px}
.nf h1{font:700 clamp(44px,5vw,72px)/.95 var(--d);letter-spacing:-.03em}
.nf p{font-size:19px;color:#bdbdbd}
@media (max-width:1023px){.pd .wrap{grid-template-columns:1fr}.info{position:static}.rel .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.specs{grid-template-columns:1fr 1fr}.rv-form .two{grid-template-columns:1fr}.rel .card .row{flex-direction:column;align-items:flex-start;gap:12px}.stage .nav-b{opacity:1;width:40px;height:40px;margin-top:-20px}}
@media (hover:none){.stage{cursor:default}.stage .nav-b{opacity:1}}
</style>
<!--MAIN-->
<main id="main">
<div id="pd-root"></div>
</main>
<!--/MAIN-->
<script>
(() => {
'use strict';
/* ---- product detail: rendered from the catalogue by ?p=<slug> (same slugs as buycav.in/product/<slug>/) ---- */
const slugQ = new URLSearchParams(location.search).get('p');
const it = CATALOG.find(x => x.s === slugQ);
const root = $('#pd-root');
const cap = s => s ? s : '—';
if (!it) {
  document.title = 'Frame not found · CAV';
  root.innerHTML = `<section class="nf wrap"><h1>We couldn’t find that frame.</h1><p>It may have moved. Browse all CAV frames instead.</p><a class="btn btn-red btn-lg" href="shop.html">Go to the shop</a></section>`;
  return;
}
document.title = `${it.n} · CAV`;
const wa = 'https://wa.me/914843160620?text=' + encodeURIComponent(`Hello, I’d like to know more about the CAV frame ${it.n}. ${location.href.split('?')[0]}?p=${it.s}`);
const imgs = Array.from({ length: it.i }, (_, k) => `img/c/${it.s}-${k}.jpg`);
const views = ['Front view', 'Side view', 'Folded view'];
const related = CATALOG.filter(x => x.s !== it.s && x.g === it.g && x.shape === it.shape).slice(0, 4);
if (related.length < 4) related.push(...CATALOG.filter(x => x.s !== it.s && x.g === it.g && !related.includes(x)).slice(0, 4 - related.length));

root.innerHTML = `
<section class="pd" aria-label="${esc(it.n)}">
  <div class="wrap">
    <div class="gal" aria-roledescription="carousel" aria-label="Photos of ${esc(it.n)}">
      <div class="stage" id="stage">
        ${imgs.map((src, k) => `<img src="${src}" alt="${esc(it.n)}, ${views[k] ? views[k].toLowerCase() : 'photo ' + (k + 1)}" width="800" height="800" ${k ? 'loading="lazy"' : 'fetchpriority="high"'} class="${k ? '' : 'on'}">`).join('')}
        ${imgs.length > 1 ? `<button class="nav-b prev" type="button" aria-label="Previous photo"><svg class="ico"><use href="#i-left"/></svg></button><button class="nav-b next" type="button" aria-label="Next photo"><svg class="ico"><use href="#i-right"/></svg></button><span class="idx" aria-live="polite">1 / ${imgs.length}</span>` : ''}
      </div>
      ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((src, k) => `<button type="button" aria-label="Show ${views[k] ? views[k].toLowerCase() : 'photo ' + (k + 1)}" ${k ? '' : 'aria-current="true"'}><img src="${src}" alt="" loading="lazy" width="800" height="800"></button>`).join('')}</div>` : ''}
    </div>

    <div class="info">
      <p class="kick"><a href="shop.html?cat=frames">${esc(it.cat)}</a> · CAV</p>
      <h1><span class="m">${esc(it.m)}</span> <span class="c">${esc(it.c)}</span></h1>
      ${it.short ? `<p class="short">${esc(it.short)}</p>` : ''}
      <dl class="specs">
        <div><dt>Model</dt><dd>${esc(cap(it.m))}</dd></div>
        <div><dt>Material</dt><dd>${esc(cap(it.mat))}</dd></div>
        <div><dt>Colour</dt><dd class="cw"><i class="swd" style="--c:${swatch(it.c)}"></i>${esc(cap(it.c))}</dd></div>
        <div><dt>Size</dt><dd>${esc(cap(it.size))}</dd></div>
        <div><dt>Gender</dt><dd>${esc(cap(it.g))}</dd></div>
        <div><dt>Shape</dt><dd>${esc(cap(it.shape))}</dd></div>
        <div><dt>Availability</dt><dd>${it.av ? `<span class="av">${esc(it.av)}</span>` : '—'}</dd></div>
        <div><dt>Price</dt><dd>${it.price ? esc(it.price) : 'Price on request'}</dd></div>
      </dl>
      <div class="cta">
        <a class="btn btn-red btn-lg" href="locate.html">Shop At <span class="arrow" aria-hidden="true">→</span></a>
        <a class="btn btn-lg wa-b" href="${wa}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wa"/></svg>Ask on WhatsApp</a>
      </div>
      <p class="meta-l"><span>Brand: <b>CAV</b></span><span>Category: <b>${esc(it.cat)}</b></span></p>
    </div>
  </div>
</section>

<section class="rw light" id="reviews" aria-labelledby="rw-h">
  <div class="wrap">
    <aside class="rw-sum">
      <h2 id="rw-h">Reviews</h2>
      <div class="rw-avg" id="rw-avg"></div>
      <ul class="rw-bars" id="rw-bars" aria-label="Filter reviews by rating"></ul>
      <button class="btn btn-red btn-sm" type="button" id="rw-write" aria-controls="rv-form" aria-expanded="false" style="justify-self:start">Write a review</button>
    </aside>
    <div class="rw-main">
      <p class="rv-done" id="rv-done" hidden tabindex="-1" role="status">Thank you. Your review is shown below and goes live once CAV approves it.</p>
      <form class="rv-form" id="rv-form" novalidate hidden>
        <h3>Review ${esc(it.m)} ${esc(it.c)}</h3>
        <fieldset class="stars" id="stars"><legend>Your rating <span style="color:var(--red)" aria-hidden="true">*</span></legend>
          ${[1, 2, 3, 4, 5].map(n => `<input type="radio" name="rating" id="st${n}" value="${n}"><label for="st${n}" aria-label="${n} star${n > 1 ? 's' : ''}">★</label>`).join('')}
        </fieldset>
        <p class="err" id="e-rating" style="font-size:14px;font-weight:600;color:#c4161c"></p>
        <div class="field"><label for="rv-text">Your review <span class="req" aria-hidden="true">*</span></label><textarea id="rv-text" name="comment" required maxlength="1500" aria-describedby="e-text"></textarea><p class="err" id="e-text"></p></div>
        <div class="two">
          <div class="field"><label for="rv-name">Name <span class="req" aria-hidden="true">*</span></label><input id="rv-name" name="author" autocomplete="name" required maxlength="60" aria-describedby="e-rname"><p class="err" id="e-rname"></p></div>
          <div class="field"><label for="rv-email">Email <span class="req" aria-hidden="true">*</span></label><input id="rv-email" name="email" type="email" autocomplete="email" required aria-describedby="e-remail"><p class="err" id="e-remail"></p></div>
        </div>
        <div class="acts"><button class="btn btn-red btn-lg" type="submit">Submit review</button><button class="btn btn-white btn-lg" type="button" id="rv-cancel">Cancel</button></div>
        <p class="note">Your email is not published. Reviews appear once CAV approves them.</p>
      </form>
      <div class="rw-head"><p id="rw-count" aria-live="polite"></p>
        <div class="field"><label for="rw-sort">Sort by</label><select id="rw-sort"><option value="new">Most recent</option><option value="high">Highest rated</option><option value="low">Lowest rated</option></select></div>
      </div>
      <ul class="rw-list" id="rw-list"></ul>
      <button class="btn btn-white btn-sm rw-more" type="button" id="rw-more" hidden>Show more reviews</button>
    </div>
  </div>
</section>

${related.length ? `<section class="rel" aria-labelledby="rel-h"><div class="wrap">
  <h2 class="h2 rv" id="rel-h"><span class="mask"><span>Related products</span></span></h2>
  <ul class="pgrid">${related.map(x => `<li><article class="card">
    <a class="ph" href="product.html?p=${x.s}" tabindex="-1" aria-hidden="true"><img src="img/c/${x.s}-0.jpg" alt="" loading="lazy" width="800" height="800"></a>
    <div class="row"><div><h3><a href="product.html?p=${x.s}">${esc(x.m)}</a></h3><p class="sw"><i style="--c:${swatch(x.c)}"></i>${esc(x.c)} · ${esc(x.g)}</p></div>
    <a class="btn btn-white btn-sm" href="locate.html">Shop At</a></div></article></li>`).join('')}</ul>
</div></section>` : ''}`;
revealWatch(root);

/* ---- gallery: arrows, thumbnails, keyboard, swipe, hover zoom ---- */
const stage = $('#stage'), pics = $$('img', stage), thumbs = $$('.thumbs button'), idx = $('.idx', stage);
let cur = 0;
const show = k => {
  cur = (k + pics.length) % pics.length;
  pics.forEach((p, j) => p.classList.toggle('on', j === cur));
  thumbs.forEach((t, j) => t.setAttribute('aria-current', j === cur));
  if (idx) idx.textContent = `${cur + 1} / ${pics.length}`;
};
if (pics.length > 1) {
  $('.prev', stage).addEventListener('click', () => show(cur - 1));
  $('.next', stage).addEventListener('click', () => show(cur + 1));
  thumbs.forEach((t, j) => t.addEventListener('click', () => show(j)));
  $('.gal').addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
  let sx = 0, sy = 0;
  stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') { sx = e.clientX; sy = e.clientY; } });
  stage.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') return; const dx = e.clientX - sx; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(e.clientY - sy)) show(cur + (dx < 0 ? 1 : -1)); });
}
if (mqFine.matches && !reduced()) {
  stage.addEventListener('mousemove', e => {
    if (e.target.closest('.nav-b')) return stage.classList.remove('is-zoom');
    const r = stage.getBoundingClientRect();
    stage.style.setProperty('--ox', ((e.clientX - r.left) / r.width * 100) + '%');
    stage.style.setProperty('--oy', ((e.clientY - r.top) / r.height * 100) + '%');
    stage.classList.add('is-zoom');
  });
  stage.addEventListener('mouseleave', () => stage.classList.remove('is-zoom'));
}

/* ---- reviews ----
   Approved reviews per product go in REVIEWS (buycav.in has none yet). Until then the prototype shows
   SAMPLE reviews, tagged "Sample" on screen. ponytail: remove SAMPLE once real reviews are synced. */
const REVIEWS = {};
const SAMPLE = [
  { name: 'Anjali R.', rating: 5, date: '2026-10-12', text: 'Light on the face and comfortable all day. The team at the showroom helped me get the fit right.', sample: true },
  { name: 'Rahul M.', rating: 4, date: '2026-09-28', text: 'Good build for everyday wear. The colour looks the same as in the photos.', sample: true },
  { name: 'Fathima S.', rating: 5, date: '2026-08-30', text: 'My second CAV frame. The hinges feel sturdy and it still looks new after months of use.', sample: true },
];
const KEY = 'cav_reviews_' + it.s;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} };
const approved = REVIEWS[it.s] || SAMPLE;
let mine = load(), filter = 0, shown = 3;
const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const stars = (r, fs) => `<span class="rate" style="--r:${r}${fs ? ';--fs:' + fs : ''}" role="img" aria-label="Rated ${r} out of 5"><i></i></span>`;

const renderSummary = () => {
  const n = approved.length, avg = n ? approved.reduce((a, r) => a + r.rating, 0) / n : 0;
  $('#rw-avg').innerHTML = n
    ? `<b>${avg.toFixed(1)}</b><div>${stars(Math.round(avg * 10) / 10)}<p>Based on ${n} review${n > 1 ? 's' : ''}</p></div>`
    : `<div><p style="font-size:17px">No reviews yet. Be the first to review this frame.</p></div>`;
  $('#rw-bars').innerHTML = [5, 4, 3, 2, 1].map(s => {
    const c = approved.filter(r => r.rating === s).length;
    return `<li><button type="button" data-s="${s}" aria-pressed="${filter === s}" ${c ? '' : 'disabled'} aria-label="${s} star: ${c} review${c === 1 ? '' : 's'}">
      <span>${s} ★</span><span class="bar"><i style="--w:${n ? c / n * 100 : 0}%"></i></span><span class="n">${c}</span></button></li>`;
  }).join('');
};
const renderList = () => {
  const sort = $('#rw-sort').value;
  const by = { new: (a, b) => b.date.localeCompare(a.date), high: (a, b) => b.rating - a.rating || b.date.localeCompare(a.date), low: (a, b) => a.rating - b.rating || b.date.localeCompare(a.date) }[sort];
  // the visitor's own pending reviews stay on top; they don't count towards the average
  const list = [...mine.map(r => ({ ...r, pending: true })).sort(by), ...approved.slice().sort(by)].filter(r => !filter || r.rating === filter);
  const total = approved.filter(r => !filter || r.rating === filter).length;
  $('#rw-count').innerHTML = filter
    ? `${total} review${total === 1 ? '' : 's'} with ${filter} stars<button type="button" id="rw-clear">Show all</button>`
    : `${approved.length} review${approved.length === 1 ? '' : 's'}`;
  $('#rw-list').innerHTML = list.length ? list.slice(0, shown).map((r, i) => `<li class="rw-card" style="--i:${i}">
      <header><span class="av" aria-hidden="true">${esc(r.name.trim()[0].toUpperCase())}</span>
        <div class="who"><b>${esc(r.name)}</b><span>${fmt(r.date)}</span></div>
        ${r.pending ? '<span class="tag pend">Awaiting approval</span>' : r.sample ? '<span class="tag">Sample</span>' : ''}</header>
      ${stars(r.rating, '15px')}
      <p>${esc(r.text)}</p></li>`).join('')
    : `<li class="rw-empty">${filter ? 'No reviews with this rating yet.' : `There are no reviews yet. Be the first to review “${esc(it.n)}”.`}</li>`;
  $('#rw-more').hidden = list.length <= shown;
};
renderSummary(); renderList();
$('#rw-bars').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = filter === +b.dataset.s ? 0 : +b.dataset.s; shown = 3;
  renderSummary(); renderList();
});
$('#rw-count').addEventListener('click', e => { if (e.target.id === 'rw-clear') { filter = 0; renderSummary(); renderList(); } });
$('#rw-sort').addEventListener('change', () => { shown = 3; renderList(); });
$('#rw-more').addEventListener('click', () => { const from = shown; shown += 3; renderList(); $$('#rw-list .rw-card')[from]?.setAttribute('tabindex', '-1'); $$('#rw-list .rw-card')[from]?.focus(); });

/* ---- write a review: stars, required fields; reviews are moderated, so they show as awaiting approval ---- */
const form = $('#rv-form'), write = $('#rw-write');
const openForm = open => {
  form.hidden = !open; write.setAttribute('aria-expanded', open);
  if (open) { $('#rv-done').hidden = true; form.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); setTimeout(() => $('#st1').focus({ preventScroll: true }), reduced() ? 0 : 350); }
};
write.addEventListener('click', () => openForm(form.hidden));
$('#rv-cancel').addEventListener('click', () => { openForm(false); write.focus(); });
const labels = $$('#stars label');
const light = n => labels.forEach((l, j) => l.classList.toggle('lit', j < n));
labels.forEach((l, j) => { l.addEventListener('mouseenter', () => light(j + 1)); });
$('#stars').addEventListener('mouseleave', () => light(+($('#stars input:checked') || { value: 0 }).value));
$('#stars').addEventListener('change', e => { light(+e.target.value); $('#e-rating').textContent = ''; });
const err = (input, msg) => { input.setAttribute('aria-invalid', !!msg); $('#' + input.getAttribute('aria-describedby')).textContent = msg; return !msg; };
form.addEventListener('submit', e => {
  e.preventDefault();
  const bad = [], picked = $('#stars input:checked');
  if (!picked) { $('#e-rating').textContent = 'Please choose a rating.'; bad.push($('#st1')); }
  const t = $('#rv-text'), n = $('#rv-name'), m = $('#rv-email');
  if (!err(t, t.value.trim() ? '' : 'Please write your review.')) bad.push(t);
  if (!err(n, n.value.trim() ? '' : 'Please enter your name.')) bad.push(n);
  if (!err(m, /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m.value.trim()) ? '' : 'Please enter a valid email.')) bad.push(m);
  if (bad.length) return bad[0].focus();
  // the email is only needed for moderation, so it is not kept in the browser
  mine.unshift({ name: n.value.trim(), rating: +picked.value, date: new Date().toISOString().slice(0, 10), text: t.value.trim() });
  save(mine);
  form.reset(); light(0); filter = 0; shown = 3;
  openForm(false); renderSummary(); renderList();
  $('#rv-done').hidden = false; $('#rv-done').focus();
});
})();
</script>
